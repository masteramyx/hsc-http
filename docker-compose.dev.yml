version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: hsc-traefik
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8081:8080"   # Traefik dashboard
    volumes:
      # Docker socket access for automatic service discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Traefik configuration file
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Let's Encrypt certificate storage
      - traefik-acme:/acme
    # Traefik labels for configuring its own dashboard
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  postgres:
    image: postgres:15
    container_name: hsc-postgres-dev
    environment:
      POSTGRES_DB: healthshadow_dev
      POSTGRES_USER: hsc_user
      POSTGRES_PASSWORD: hsc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/init-documenso.sql:/docker-entrypoint-initdb.d/init-documenso.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsc_user -d healthshadow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: hsc-http:latest
    container_name: hsc-app-dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/healthshadow_dev
      - DATABASE_USER=hsc_user
      - DATABASE_PASSWORD=hsc_dev_password
      - HOST=0.0.0.0
    # Centralized logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Traefik labels for automatic service discovery and routing
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hsc-app.rule=Host(`${DOMAIN:-shadowconnects.localhost}`)"
      - "traefik.http.routers.hsc-app.entrypoints=websecure"
      - "traefik.http.routers.hsc-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.hsc-app.loadbalancer.server.port=8080"

  documenso:
    image: documenso/documenso:latest
    container_name: hsc-documenso-dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Auth secrets
      - NEXTAUTH_SECRET=supersecretkey123456789012345678
      - NEXT_PRIVATE_ENCRYPTION_KEY=01234567890123456789012345678901
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=98765432109876543210987654321098

      # URLs
      - NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000
      - NEXT_PRIVATE_INTERNAL_WEBAPP_URL=http://localhost:3000

      # Database - uses separate database in same postgres container
      - NEXT_PRIVATE_DATABASE_URL=postgresql://hsc_user:hsc_dev_password@postgres:5432/documenso_dev
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgresql://hsc_user:hsc_dev_password@postgres:5432/documenso_dev

      # Email - add your Resend API key
      - NEXT_PRIVATE_SMTP_HOST=smtp.resend.com
      - NEXT_PRIVATE_SMTP_PORT=587
      - NEXT_PRIVATE_SMTP_USERNAME=resend
      - NEXT_PRIVATE_SMTP_PASSWORD=${RESEND_API_KEY}
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=noreply@shadowconnects.com
      - NEXT_PRIVATE_SMTP_FROM_NAME=ShadowConnects

      # Signing
      - NEXT_PRIVATE_SIGNING_TRANSPORT=local

      # Storage - use database for local dev
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  # Let's Encrypt certificate storage for automatic SSL
  traefik-acme:
    driver: local

