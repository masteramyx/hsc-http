databases:
  - name: hsc-http-db
    databaseName: healthshadow_dev
    user: hsc_user
    plan: free

services:
  - type: web
    name: hsc-http-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hsc-http-db
          property: connectionString
      - key: PORT
        value: 8080