services:
  # PostgreSQL Database
  - type: pserv
    name: hsc-http-db
    plan: free
    databaseName: healthshadow_dev
    databaseUser: hsc_user

  # Ktor Backend (serves React frontend too)
  - type: web
    name: hsc-http-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hsc-http-db
          property: connectionString
      - key: PORT
        value: 8080