ktor {
    deployment {
        port = 8080
        host = 0.0.0.0
        // Max request body size for file uploads (10MB)
        // Set higher than validation limit (5MB) for safety buffer
        maxRequestSize = 10485760
    }
    deployment {
        port = ${?PORT}
        host = ${?HOST}
    }
    application {
        modules = [ com.shadowconnect.ApplicationKt.module ]
    }
}
